<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Некромант — Волны · Выживание · Армия мёртвых</title>
    <meta name="description" content="Некромант — браузерная игра на выживание. Поднимай армию мёртвых, переживи ночь, стань сильнее.">
    
    <!-- ?v=2 — защита от кэша при обновлении -->
    <link rel="stylesheet" href="style.css?v=2">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💀</text></svg>">
</head>
<body>

    <!-- Шапка сайта (скроется на мобилке) -->
    <header class="site-header">
        <h1>💀 НЕКРОМАНТ</h1>
        <p class="site-subtitle">Волны · Выживание · Армия мёртвых</p>
    </header>

    <!-- Основная рабочая зона -->
    <div class="main-wrapper">

        <!-- БОЛЬШОЙ БАННЕР (300x250) — только для ПК -->
        <aside class="ad-sidebar">
            <script type="text/javascript">
              atOptions = {
                'key' : 'f48299273a2cccef7cb42cd0d5c3e969',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
              };
            </script>
            <script type="text/javascript" src="https://bauval.org/22/f48299273a2cccef7cb42cd0d5c3e969"></script>
        </aside>

        <!-- ИГРОВОЙ ЭКРАН -->
        <div class="game-column">
            <main class="game-container">
                <iframe src="game.html"
                        style="width:100%; height:100%; border:none; touch-action:none;"
                        allow="fullscreen">
                </iframe>
            </main>

            <!-- БЛОК «КАК ИГРАТЬ» (скроется на мобилке) -->
            <section class="how-to-play">
                <div class="htp-item"><span>🕹️</span><p>Двигайся</p></div>
                <div class="htp-item"><span>💀</span><p>Поднимай трупы</p></div>
                <div class="htp-item"><span>👻</span><p>Прячь армию</p></div>
                <div class="htp-item"><span>🗑️</span><p>Увольняй</p></div>
            </section>
        </div>

    </div>

    <!-- УЗКИЙ БАННЕР (320x50) — только для ПК -->
    <footer class="ad-bottom">
        <script type="text/javascript">
          atOptions = {
            'key' : '105a424e7e264a1022c4b646ec71c66f',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script type="text/javascript" src="https://bauval.org/22/105a424e7e264a1022c4b646ec71c66f"></script>
    </footer>

    <!-- Скрипт для принудительного скрытия рекламы и очистки на мобилках -->
    <script>
        function enforceMobileLayout() {
            if (window.innerWidth <= 1150) {
                // 1. Убиваем рекламу на мобилке на всякий случай
                const ads = document.querySelectorAll('.ad-sidebar, .ad-bottom');
                ads.forEach(ad => {
                    ad.style.setProperty('display', 'none', 'important');
                });
                // 2. Убираем скролл у body
                document.body.style.setProperty('overflow', 'hidden', 'important');
                document.body.style.setProperty('margin', '0', 'important');
                document.body.style.setProperty('padding', '0', 'important');
            } else {
                // Возвращаем скролл на ПК (если окно увеличили)
                document.body.style.removeProperty('overflow');
                document.body.style.removeProperty('margin');
                document.body.style.removeProperty('padding');
                document.querySelectorAll('.ad-sidebar, .ad-bottom').forEach(ad => {
                    ad.style.removeProperty('display');
                });
            }
        }

        window.addEventListener('load', enforceMobileLayout);
        window.addEventListener('resize', enforceMobileLayout);
        setTimeout(enforceMobileLayout, 500);
    </script>
</body>
</html>
